# ByteTrack profile tuned for road scenes (pedestrians + crosswalks)
# Prioritize stable IDs (fewer switches) through brief occlusion / jitter.

tracker_type: bytetrack
track_high_thresh: 0.50
track_low_thresh: 0.05
new_track_thresh: 0.65
track_buffer: 60
match_thresh: 0.75
fuse_score: true
min_box_area: 20
mot20: false
